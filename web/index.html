<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2b26" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="A market for graded collectible cards on Monad. Each card and grade trades on its own on-chain order book, priced in dollars and settled in under a second." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tivan" />
    <meta property="og:description" content="A market for graded collectible cards on Monad." />
    <meta property="og:url" content="https://bunnyyxtan.github.io/tivan/" />
    <meta property="og:image" content="https://bunnyyxtan.github.io/tivan/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Sets the colour mode before first paint so there is no flash. Mirrors apply() in src/fx.tsx.
      try {
        var p = JSON.parse(localStorage.getItem('tivan.prefs') || '{}')
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : p.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        var r = document.documentElement
        r.dataset.theme = t
        r.dataset.appearance = p.theme === 'light' || p.theme === 'system' ? p.theme : 'dark'
        r.style.colorScheme = t
        document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#eef8f0' : '#0b2b26')
      } catch (e) {}
    </script>
    <title>Tivan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
