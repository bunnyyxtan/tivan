<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Sets the colour mode before first paint so there is no flash. Mirrors apply() in src/fx.tsx.
      try {
        var p = JSON.parse(localStorage.getItem('tivan.prefs') || '{}')
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : p.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        var r = document.documentElement
        r.dataset.theme = t
        r.dataset.appearance = p.theme === 'light' || p.theme === 'system' ? p.theme : 'dark'
        r.style.colorScheme = t
        document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#f7f6f2' : '#0a0a0b')
      } catch (e) {}
    </script>
    <title>Tivan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
