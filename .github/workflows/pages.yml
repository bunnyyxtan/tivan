# Builds the web app and publishes it to GitHub Pages on every push to main.
# Set repository Variables: VITE_ATTESTOR_URL (hosted attestor, optional), VITE_INDEXER_URL (Envio GraphQL, optional).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_NETWORK: testnet
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_ATTESTOR_URL: ${{ vars.VITE_ATTESTOR_URL }}
          VITE_INDEXER_URL: ${{ vars.VITE_INDEXER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
