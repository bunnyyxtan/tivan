# One-click host for the attestor: Render dashboard > New > Blueprint > pick this repo.
# Then set DEPLOYER_KEY (a funded testnet key) when it asks, and copy the service URL into the repo variable VITE_ATTESTOR_URL.
services:
  - type: web
    name: tivan-attestor
    runtime: node
    plan: free
    rootDir: attestor
    # The market maker (scripts/maker.mjs) runs beside the attestor so books refill even when no laptop is on.
    # It idles with a one-line error if MAKER_KEY is not set.
    buildCommand: npm ci && npm ci --prefix ../scripts
    startCommand: sh -c "node ../scripts/maker.mjs & exec npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NETWORK
        value: testnet
      - key: DEPLOYER_KEY
        sync: false
      # Dedicated RPC for the signer (Alchemy). Server-side, so unlike the web app's key this one stays secret.
      # Without it the attestor falls back to the public testnet RPC, which it shares per-IP with the maker below.
      - key: RPC_URL
        sync: false
      - key: MAKER_KEY
        sync: false
